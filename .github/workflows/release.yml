name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on public main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Run script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Verify release tag and project version
        id: version
        run: |
          version="$(python3 scripts/verify_release.py --tag "$GITHUB_REF_NAME" --print-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Build release archive
        run: ./gradlew test distZip

      - name: Verify release archive
        run: python3 scripts/verify_release.py --tag "$GITHUB_REF_NAME" --archive "build/distributions/sparkdoctor-${{ steps.version.outputs.version }}.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: build/distributions/sparkdoctor-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
