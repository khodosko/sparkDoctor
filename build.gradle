plugins {
    id "application"
    id "java"
}

group = "com.sparkdoctor"
version = "0.1.1"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    applicationName = "sparkdoctor"
    mainClass = "com.sparkdoctor.SparkDoctorCli"
}

distributions {
    main {
        distributionBaseName = "sparkdoctor"
        contents {
            from("README.md")
            from("LICENSE")
            from("CHANGELOG.md")
            from("CONTRIBUTING.md")
            from("ROADMAP.md")
            from("docs") {
                into "docs"
            }
        }
    }
}

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.2"
    implementation "com.github.luben:zstd-jni:1.5.7-9"
    implementation "info.picocli:picocli:4.7.6"
    implementation "at.yawk.lz4:lz4-java:1.8.1"
    implementation "org.xerial.snappy:snappy-java:1.1.10.6"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:all", "-Werror"]
}

tasks.named("test") {
    useJUnitPlatform()
}

tasks.named("wrapper") {
    gradleVersion = "9.5.1"
    distributionType = org.gradle.api.tasks.wrapper.Wrapper.DistributionType.BIN
}
